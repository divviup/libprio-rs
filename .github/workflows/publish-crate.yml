name: publish-crate

on:
  release:
    types: [published]

jobs:
  crate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - id: auth
      uses: rust-lang/crates-io-auth-action@v1.0.6
    - run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
