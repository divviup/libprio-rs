[package]
name = "prio"
version = "0.18.1"
authors = ["Josh Aas <jaas@kflag.net>", "Tim Geoghegan <timg@letsencrypt.org>", "Christopher Patton <cpatton@cloudflare.com", "Karl Tarbe <tarbe@apple.com>"]
edition = "2021"
exclude = ["/supply-chain"]
description = "Implementation of the Prio aggregation system core: https://crypto.stanford.edu/prio/"
license = "MPL-2.0 AND Apache-2.0 AND MIT"
repository = "https://github.com/divviup/libprio-rs"
rust-version = "1.89"
resolver = "2"

[dependencies]
aes = { version = "0.9.1", optional = true }
bitvec = { version = "1.0.1", optional = true, default-features = false, features = ["alloc"] }
ctr = { version = "0.10.1", optional = true }
fiat-crypto = { version = "0.3.0", optional = true, default-features = false }
hex = { version = "0.4.3", features = ["serde"], optional = true }
hmac = { version = "0.13.0", optional = true }
num-bigint-0-4 = { package = "num-bigint", version = "0.4.2", default-features = false }
num-bigint-0-5 = { package = "num-bigint", version = "0.5.1", default-features = false, features = ["serde"] }
num-integer = { version = "0.1.46", default-features = false }
num-iter = { version = "0.1.45", default-features = false }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint", "serde"] }
num-traits = { version = "0.2.19", default-features = false }
rand = { version = "0.10", default-features = false }
rand_core = "0.10"
rand_distr = { version = "0.6.0", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
turboshake = "0.7.1"
subtle = { version = "2.6.1", default-features = false, features = ["i128"] }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
assert_matches = "1.5.0"
base64 = "0.23.0"
cfg-if = "1.0.4"
criterion = "0.8"
iai = "0.1"
modinverse = "0.2.0"
once_cell = "1.21.4"
prio = { path = ".", features = ["crypto-dependencies", "test-util"] }
rand = { version = "0.10", default-features = false, features = ["std_rng", "sys_rng", "thread_rng"] }
statrs = "0.19.0"

[features]
default = ["crypto-dependencies", "std"]
experimental = ["bitvec", "fiat-crypto"]
multithreaded = ["rayon"]
crypto-dependencies = ["aes", "ctr", "hmac", "sha2"]
std = [
    "num-bigint-0-4/std",
    "num-bigint-0-5/std",
    "num-integer/std",
    "num-iter/std",
    "num-rational/std",
    "num-traits/std",
    "rand/std",
    "rand/sys_rng",
    "rand/thread_rng",
    "serde/std",
    "subtle/std",
    "thiserror/std",
]
test-util = ["hex", "serde_json", "rand_distr", "rand/std_rng", "rand/sys_rng", "rand/thread_rng"]

[workspace]
members = [".", "binaries"]

[lib]
bench = false

[[bench]]
name = "speed_tests"
harness = false

[[bench]]
name = "cycle_counts"
harness = false

[[test]]
name = "discrete_gauss"
path = "tests/discrete_gauss.rs"
required-features = ["experimental"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bitvec::boxed::BitBox",
    "bitvec::slice::BitSlice",
    "bitvec::vec::BitVec",
    "num_bigint::bigint::BigInt",
    "num_bigint::biguint::BigUint",
    "num_bigint::TryFromBigIntError",
    "rand_core::CryptoRng",
    "rand_core::Rng",
    "rand_core::seedable_rng::SeedableRng",
    "rand_core::TryRng",
    "rand::distr::distribution::Distribution",
    "serde_core::de::Deserialize",
    "serde_core::de::DeserializeOwned",
    "serde_core::ser::Serialize",
    "serde_json::value::Value",
    "subtle::Choice",
    "subtle::ConditionallyNegatable",
    "subtle::ConditionallySelectable",
    "subtle::ConstantTimeEq",
    "subtle::ConstantTimeLess",
]
